services:
  api:
    build:
      context: .
      target: runtime
    image: nest-docker-app:local
    container_name: nest-docker-app
    # Só as variáveis da API (sem POSTGRES_*)
    env_file:
      - .env.api
    environment:
      # Senha lida do arquivo montado pelo Docker secret (não fica no env/docker inspect)
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      # porta_da_maquina (HOST_PORT no .env) : porta interna fixa da API
      - "${HOST_PORT:-3000}:3000"
    networks:
      - nest-net
    depends_on:
      postgres:
        # só sobe a API depois que o Postgres passa no healthcheck
        condition: service_healthy
    restart: unless-stopped
    # Health check definido no Dockerfile (HEALTHCHECK com node) — vale também fora do compose
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Imagem pinada por versão + digest
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    container_name: nest-docker-postgres
    # Só as variáveis do Postgres (sem DB_* da API)
    env_file:
      - .env.postgres
    environment:
      # Senha do ADMIN (POSTGRES_USER, superuser) — convenção _FILE da imagem oficial
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      # Senha da role da APLICAÇÃO (sem superuser), usada pelo script de init
      APP_DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - postgres_admin_password
      - db_password
    volumes:
      # Postgres 18+: o volume é montado em /var/lib/postgresql (não mais em /data)
      - postgres-data:/var/lib/postgresql
      # Cria a role da aplicação na primeira inicialização do volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nest-net
    # Sem porta publicada: só a API (mesma rede) alcança o banco.
    # Para acessar do Mac (DBeaver/psql), descomente — preso a 127.0.0.1:
    # ports:
    #   - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  # Arquivo local fora do git (.gitignore) e fora da imagem (.dockerignore).
  # Montado em /run/secrets/db_password nos serviços que o declaram.
  # Senha da role da aplicação (API + script de init do Postgres)
  db_password:
    file: ./secrets/db_password.txt
  # Senha do superuser do Postgres — só o container do banco recebe
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt

networks:
  nest-net:
    name: nest-net
    driver: bridge

volumes:
  postgres-data:
    name: nest-docker-postgres-data
