name: Bug
description: Comportamento incorreto ou falha
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: comportamento-atual
    attributes:
      label: O que acontece
      description: Sintoma observado. Cole a mensagem de erro e os logs relevantes (sem senhas ou dados pessoais).
    validations:
      required: true
  - type: textarea
    id: comportamento-esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: diagnostico
    attributes:
      label: Saída do diagnóstico
      description: Se for conexão com o banco, cole a saída de ./scripts/diagnosticar-conexao.sh
      render: text
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      value: |
        - [ ] O erro não ocorre mais seguindo os passos de reprodução
        - [ ]
