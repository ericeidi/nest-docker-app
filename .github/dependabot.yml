# Atualização automática de dependências e imagens.
# Imagens pinadas por digest e lockfile travado não recebem correções sozinhos —
# o Dependabot abre PRs para isso. Os PRs passam pelo fluxo normal (main protegida).
version: 2
updates:
  # Dependências npm (package.json + package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels: [chore, P3]
    groups:
      # Patches e minors de produção em um único PR
      producao:
        dependency-type: production
        update-types: [minor, patch]
      # Patches e minors de desenvolvimento em um único PR
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
      # Pacotes @nestjs/* sobem juntos (majors inclusive) para não ficarem desalinhados
      nestjs:
        patterns: ["@nestjs/*"]

  # Imagens do Dockerfile (node e alpine pinados por versão + digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    labels: [chore, infra, P3]

  # Imagens do docker-compose.yml (postgres pinado por versão + digest)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    labels: [chore, infra, P3]

  # GitHub Actions (para o CI da issue #18) — pinadas por SHA
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    labels: [chore, infra, P3]
